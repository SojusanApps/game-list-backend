## RabbitMQ 4.3+ disables transient_nonexcl_queues by default. Celery/Kombu's
## pidbox reply queue (used by `celery inspect`/mingle at worker startup)
## still declares queues as non-durable + non-exclusive, which this rejects
## with (541) INTERNAL_ERROR. Fixed upstream but not yet released:
## https://github.com/celery/kombu/pull/2531 (closes celery/kombu#2237)
## Remove this file once kombu ships the fix and the project's dependency
## on it is bumped past that release.
deprecated_features.permit.transient_nonexcl_queues = true
deprecated_features.permit.global_qos = true
