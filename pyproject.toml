[project]
name = "my-game-list"
dynamic = ["version"]
description = "My Game List is a web application that allows users to manage their game lists."
readme = "README.md"
authors = [
    { name = "Rafał Grzegorczyk", email = "grzegorczyk1rafal@gmail.com" },
]
requires-python = ">=3.14"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.14",
    "Framework :: Django",
]
dependencies = [
    "django==6.0.6",
    "djangorestframework==3.17.1",
    "django-filter==25.2",
    "django-extensions==4.1",
    "django-redis==7.0.0",
    "django-cors-headers==4.9.0",
    "PyJWT==2.13.0",
    "celery==5.6.3",
    "django-celery-results==2.6.0",
    "django-celery-beat==2.9.0",
    "gunicorn==26.0.0",
    "redis==8.0.0",
    "colorlog==6.10.1",
    "drf-spectacular==0.29.0",
    "pillow==12.2.0",
    "django_prometheus==2.5.0",
    "pip-prometheus==1.2.1",
    "prometheus-client==0.25.0",
    "psutil==7.2.2",
    "PyYAML==6.0.3",
    "setuptools==82.0.1",
    "requests-futures==1.0.2",
    "django_memcached_consul==0.2.0",
    "cryptography==49.0.0",
    "django-stubs-ext==6.0.5",
    "psycopg[binary]==3.3.4",
    "opentelemetry-api==1.42.1",
    "opentelemetry-sdk==1.42.1",
    "opentelemetry-exporter-otlp==1.42.1",
    "opentelemetry-instrumentation-django==0.63b1",
    "opentelemetry-instrumentation-celery==0.63b1",
    "opentelemetry-instrumentation-psycopg==0.63b1",
    "opentelemetry-instrumentation-redis==0.63b1",
    "opentelemetry-instrumentation-logging==0.63b1",
    "opentelemetry-instrumentation-requests>=0.63b1",
    "opentelemetry-instrumentation-urllib>=0.63b1",
    "opentelemetry-instrumentation-urllib3>=0.63b1",
    "django-modeltranslation>=0.20.3",
    "rapidfuzz==3.14.5",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = { attr = "my_game_list.__version__" }

[project.optional-dependencies]
test = [
    "pytest==9.1.0",
    "pytest-django==4.12.0",
    "freezegun==1.5.5",
    "pytest-icdiff==0.9",
    "pytest-xdist==3.8.0",
    "pytest-sugar==1.1.1",
    "model-bakery==1.23.5",
    "testcontainers[postgres]==4.14.2",
]
cov = ["pytest-cov==7.1.0"]
tox = ["tox-uv==1.35.2"]

[dependency-groups]
dev = [
    "isort==8.0.1",
    "ipython==9.14.1",
    "pre-commit==4.6.0",
    "black==26.5.1",
    "ruff==0.15.18",
    "mypy==2.1.0",
    "django-rosetta==0.10.3",
    "django-stubs==6.0.5",
    "djangorestframework-stubs==3.17.0",
    "types-setuptools==82.0.0.20260518",
    "types-requests==2.33.0.20260518",
    "types-psutil==7.2.2.20260518",
    "types-redis==4.6.0.20241004",
    "django-tui==24.5",
    "aiosmtpd==1.4.6",
    "django-filter-stubs==0.1.3",
    "typer==0.26.7",
    "celery-types==0.26.0",
]

[project.scripts]
django-admin = "django.core.management:execute_from_command_line"

[project.urls]
Homepage = "https://github.com/SojusanApps/my-game-list-backend"
Repository = "https://github.com/SojusanApps/my-game-list-backend"

[tool.black]
# Compatible with the ruff line length
line-length = 120

[tool.ruff]
line-length = 120
extend-exclude = ["*/migrations/*", "stubs/*"]

[tool.ruff.lint]
# https://docs.astral.sh/ruff/rules/
select = [
    "F",     # Pyflakes
    "E",
    "W",     # pycodestyle
    "C90",   # mccabe
    "I",     # isort
    "N",     # pep8-naming
    "D",     # pydocstyle
    "UP",    # pyupgrade
    "ANN",   # flake8-annotations
    "ASYNC", # flake8-async
    "S",     # flake8-bandit
    "BLE",   # flake8-blind-except
    "FBT",   # flake8-boolean-trap
    "B",     # flake8-bugbear
    "A",     # flake8-builtins
    "COM",   # flake8-commas
    "C4",    # flake8-comprehensions
    "DTZ",   # flake8-datetimez
    "T10",   # flake8-debugger
    "DJ",    # flake8-django
    "EM",    # flake8-errmsg
    "EXE",   # flake8-executable
    "ISC",   # flake8-implicit-str-concat
    "ICN",   # flake8-import-conventions
    "LOG",   # flake8-logging
    "G",     # flake8-logging-format
    "INP",   # flake8-no-pep420
    "PIE",   # flake8-pie
    "T20",   # flake8-print
    "PYI",   # flake8-pyi
    "PT",    # flake8-pytest-style
    "Q",     # flake8-quotes
    "RSE",   # flake8-raise
    "RET",   # flake8-return
    "SLF",   # flake8-self
    "SLOT",  # flake8-slots
    "SIM",   # flake8-simplify
    "TID",   # flake8-tidy-imports
    "TC",    # flake8-type-checking
    "INT",   # flake8-gettext
    "ARG",   # flake8-unused-arguments
    "PTH",   # flake8-use-pathlib
    "TD",    # flake8-todos
    "ERA",   # eradicate
    "PGH",   # pygrep-hooks
    "PL",
    "PLC",
    "PLE",
    "PLR",
    "PLW",   # Pylint
    "TRY",   # tryceratops
    "FLY",   # flynt
    "PERF",  # Perflint
    "FURB",  # refurb
    "DOC",   # pydoclint
    "RUF",   # Ruff-specific-rules
]
ignore = [
    "D203", # in conflict with D211
    "D212", # in conflict with D213
]

[tool.ruff.lint.flake8-pytest-style]
mark-parentheses = true

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "PLR0913"]
"scripts/*" = ["INP001"]
"docker/app/gunicorn.conf.py" = ["INP001"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
mypy_path = ["src", "stubs"]
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
strict = true

[tool.django-stubs]
django_settings_module = "my_game_list.settings.settings_mypy"

[[tool.mypy.overrides]]
module = "dacite"
implicit_reexport = true

[[tool.mypy.overrides]]
# modeltranslation replaces model managers with MultilingualManager at runtime;
# django-stubs cannot resolve the substituted manager type (django-manager-missing),
# and the resulting type-inference gap cascades into var-annotated errors on M2M
# fields that target translated models. Both codes are intentionally suppressed here.
module = "my_game_list.games.models"
disable_error_code = ["django-manager-missing", "var-annotated"]
